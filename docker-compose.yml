name: sistema-agendamento

networks:
  agendamento:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  wuzapi_data:
  caddy_data:
  caddy_config:

services:
  postgres:
    image: postgres:16-alpine
    container_name: agendamento_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_agendamento}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sistema_agendamento}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - agendamento

  redis:
    image: redis:7-alpine
    container_name: agendamento_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - agendamento

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: agendamento_api
    restart: unless-stopped
    command: ["/app/api-bin"]
    env_file:
      - path: .env
        required: false
    environment:
      PORT: ${PORT:-8080}
      APP_ENV: ${APP_ENV:-production}
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-sistema_agendamento}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN_HOURS: ${JWT_EXPIRES_IN_HOURS:-72}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET:-}
      WUZAPI_BASE_URL: http://wuzapi:8080
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TZ: ${TZ:-America/Sao_Paulo}
      SEED_DEMO: ${SEED_DEMO:-false}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@plataforma.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - agendamento

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: agendamento_worker
    restart: unless-stopped
    command: ["/app/worker-bin"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_DRIVER: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-sistema_agendamento}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_BASE_URL: ${ASAAS_BASE_URL:-https://sandbox.asaas.com/api/v3}
      ASAAS_WEBHOOK_SECRET: ${ASAAS_WEBHOOK_SECRET:-}
      WUZAPI_BASE_URL: http://wuzapi:8080
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      TZ: ${TZ:-America/Sao_Paulo}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - agendamento

  wuzapi:
    image: asternic/wuzapi:latest
    container_name: agendamento_wuzapi
    restart: unless-stopped
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN}
      WUZAPI_PORT: "8080"
      TZ: ${TZ:-America/Sao_Paulo}
      WEBHOOK_FORMAT: json
      SESSION_DEVICE_NAME: SistemaAgendamento
    volumes:
      - wuzapi_data:/app/db
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - agendamento

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: agendamento_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks:
      - agendamento

  caddy:
    image: caddy:2-alpine
    container_name: agendamento_caddy
    restart: unless-stopped
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ${CADDYFILE_PATH:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - agendamento
