services:
  # -------------------------------------------------------------
  # BANCO DE DADOS: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agendamento_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sistema_agendamento
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_agendamento"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # FILAS E PROCESSAMENTO ASSÍNCRONO: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agendamento_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # API REST BACKEND (Go + Gin)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: agendamento_api
    restart: unless-stopped
    command: ["/app/api-bin"]
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: "production"
      DB_DRIVER: "postgres"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_NAME: "sistema_agendamento"
      DB_SSLMODE: "disable"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      JWT_SECRET: "super-secret-scheduling-jwt-key-2026-secure-token"
      JWT_EXPIRES_IN_HOURS: "72"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # WORKER ASYNQ (Go + Asynq + Redis)
  # -------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: agendamento_worker
    restart: unless-stopped
    command: ["/app/worker-bin"]
    environment:
      APP_ENV: "production"
      DB_DRIVER: "postgres"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_NAME: "sistema_agendamento"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # FRONTEND (Vue 3 + Vite + Tailwind + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: agendamento_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
