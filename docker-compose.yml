services:
  # -------------------------------------------------------------
  # BANCO DE DADOS: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: agendamento_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: sistema_agendamento
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sistema_agendamento"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # FILAS E PROCESSAMENTO ASSÍNCRONO: Redis 7
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: agendamento_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # API REST BACKEND (Go + Gin)
  # -------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: agendamento_api
    restart: unless-stopped
    command: ["/app/api-bin"]
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      APP_ENV: "production"
      DB_DRIVER: "postgres"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_NAME: "sistema_agendamento"
      DB_SSLMODE: "disable"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      JWT_SECRET: "super-secret-scheduling-jwt-key-2026-secure-token"
      JWT_EXPIRES_IN_HOURS: "72"
      ASAAS_API_KEY: "$aact_hmlg_000MzkwODA2MWY2OGM3MWRlMDU2NWM3MzJlNzZmNGZhZGY6OjQ1NjY2ZDQ4LWQxM2YtNDA1YS1hMmRjLTE0MjQ5NTQwNzJhNTo6JGFhY2hfOTVkODc0YmYtOWIyYi00YWEwLWFlZjYtMjgxY2YwYmQ1OTQy"
      ASAAS_BASE_URL: "https://sandbox.asaas.com/api/v3"
      ASAAS_WEBHOOK_SECRET: "whsec_hhwwxdTmKX30aXHwqiSGB9jtv9zYbM8IAo-oCDNeSdg"
      WUZAPI_BASE_URL: "http://wuzapi:8080"
      WUZAPI_ADMIN_TOKEN: "wuzapi_super_admin_secret_token_2026"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # WORKER ASYNQ (Go + Asynq + Redis)
  # -------------------------------------------------------------
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    container_name: agendamento_worker
    restart: unless-stopped
    command: ["/app/worker-bin"]
    environment:
      APP_ENV: "production"
      DB_DRIVER: "postgres"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "postgres"
      DB_PASSWORD: "postgrespassword"
      DB_NAME: "sistema_agendamento"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      ASAAS_API_KEY: "$aact_hmlg_000MzkwODA2MWY2OGM3MWRlMDU2NWM3MzJlNzZmNGZhZGY6OjQ1NjY2ZDQ4LWQxM2YtNDA1YS1hMmRjLTE0MjQ5NTQwNzJhNTo6JGFhY2hfOTVkODc0YmYtOWIyYi00YWEwLWFlZjYtMjgxY2YwYmQ1OTQy"
      ASAAS_BASE_URL: "https://sandbox.asaas.com/api/v3"
      ASAAS_WEBHOOK_SECRET: "whsec_hhwwxdTmKX30aXHwqiSGB9jtv9zYbM8IAo-oCDNeSdg"
      WUZAPI_BASE_URL: "http://wuzapi:8080"
      WUZAPI_ADMIN_TOKEN: "wuzapi_super_admin_secret_token_2026"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # -------------------------------------------------------------
  # WHATSAPP REST API SERVICE (WUZAPI)
  # -------------------------------------------------------------
  wuzapi:
    image: asternic/wuzapi:latest
    container_name: agendamento_wuzapi
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      WUZAPI_ADMIN_TOKEN: "wuzapi_super_admin_secret_token_2026"
      WUZAPI_PORT: "8080"
      TZ: "America/Sao_Paulo"
      WEBHOOK_FORMAT: "json"
      SESSION_DEVICE_NAME: "SistemaAgendamento"
    volumes:
      - wuzapi_data:/app/db
    depends_on:
      postgres:
        condition: service_healthy

  # -------------------------------------------------------------
  # FRONTEND (Vue 3 + Vite + Tailwind + Nginx)
  # -------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: agendamento_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  wuzapi_data:
