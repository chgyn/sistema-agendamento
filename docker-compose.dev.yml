# Override para desenvolvimento local (portas na máquina host).
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# O Caddy fica desativado neste perfil; acesse o frontend em http://localhost:5173

services:
  caddy:
    profiles: ["disabled"]

  postgres:
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      POSTGRES_DB: ${POSTGRES_DB:-sistema_agendamento}

  redis:
    ports:
      - "6379:6379"

  backend:
    ports:
      - "8080:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      DB_NAME: ${POSTGRES_DB:-sistema_agendamento}
      JWT_SECRET: ${JWT_SECRET:-super-secret-scheduling-jwt-key-2026-secure-token-change-in-prod}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:-wuzapi_super_admin_secret_token_2026}
      SEED_DEMO: ${SEED_DEMO:-true}

  worker:
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
      DB_NAME: ${POSTGRES_DB:-sistema_agendamento}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:-wuzapi_super_admin_secret_token_2026}

  wuzapi:
    ports:
      - "8081:8080"
    environment:
      WUZAPI_ADMIN_TOKEN: ${WUZAPI_ADMIN_TOKEN:-wuzapi_super_admin_secret_token_2026}

  frontend:
    ports:
      - "5173:80"
